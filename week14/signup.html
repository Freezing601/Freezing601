<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freezing-RTO Training | Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-container">
        <div class="logo-container">
            <img src="logo.png" alt="RTO Training Logo" class="logo">
            <span class="brand-name">Freezing-RTO</span>
        </div>
        
        <nav class="main-nav">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-home"></i><span class="nav-text">Home</span></a></li>
                <li class="nav-item"><a href="courses.html" class="nav-link"><i class="fas fa-book"></i><span class="nav-text">Courses</span></a></li>
                <li class="nav-item"><a href="resources.html" class="nav-link"><i class="fas fa-file-alt"></i><span class="nav-text">Resources</span></a></li>
                <li class="nav-item"><a href="todo.html" class="nav-link"><i class="fas fa-tasks"></i><span class="nav-text">Tasks</span></a></li>
                <li class="nav-item"><a href="shopping.html" class="nav-link"><i class="fas fa-shopping-cart"></i><span class="nav-text">Shop</span></a></li>
                <li class="nav-item"><a href="cart.html" class="nav-link"><i class="fas fa-shopping-basket"></i><span class="nav-text">Cart</span></a></li>
                <li class="nav-item"><a href="orders.html" class="nav-link"><i class="fas fa-receipt"></i><span class="nav-text">Orders</span></a></li>
                <li class="nav-item" id="auth-item"><a id="auth-link" href="#" class="nav-link auth-link"><i class="fas fa-user"></i><span class="nav-text">Login</span></a></li>
            </ul>
        </nav>
        
        <button class="mobile-menu-toggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

    <main>
        <section class="auth-section">
            <div class="container">
                <h2>Sign Up</h2>
                <form id="signup-form">
                    <div class="form-group">
                        <label for="signup-username">Username:</label>
                        <input type="text" id="signup-username" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password:</label>
                        <input type="password" id="signup-password" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm-password">Confirm Password:</label>
                        <input type="password" id="signup-confirm-password" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email:</label>
                        <input type="email" id="signup-email" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-phone">Phone Number:</label>
                        <input type="tel" id="signup-phone" required>
                    </div>
                    <button type="submit" class="cta-button">Sign Up</button>
                </form>
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Freezing-RTO Training. All rights reserved.</p>
            <p>Contact us: info@rtotraining.com | +61 123 456 789</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
